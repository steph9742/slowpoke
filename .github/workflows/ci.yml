name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique complet : la plage d'une pull request doit être résoluble.
          fetch-depth: 0

      # Le binaire plutôt que `gitleaks-action` : l'action calcule une plage
      # `<commit>^..HEAD` qui n'existe pas quand le commit initial est dedans, et sort en
      # erreur sans avoir rien scanné.
      - name: Installer gitleaks
        env:
          # Version épinglée : celle contre laquelle la configuration a été vérifiée.
          VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Arbre de travail
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact

      # Sur une pull request, l'arbre ne suffit pas : un secret ajouté puis retiré dans la
      # même branche n'y figure plus, mais reste dans l'historique qu'on s'apprête à fusionner.
      - name: Historique de la pull request
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --config .gitleaks.toml --no-banner --redact \
            --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
